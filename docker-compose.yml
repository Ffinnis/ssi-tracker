version: "3.8"

services:
  backend:
    build: ./backend
    container_name: fastify-backend
    ports:
      - "4444:4444"
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=postgres
      - PGPORT=5432
    depends_on:
      - postgres

  frontend: # Added frontend service
    build: ./frontend
    container_name: nextjs-frontend
    ports:
      - "3000:3000" # Default Next.js port
    environment:
      # Tell frontend where the backend is within the Docker network
      - NEXT_PUBLIC_API_URL=http://localhost:4444
    depends_on:
      - backend # Ensure backend starts first

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
